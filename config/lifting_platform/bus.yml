options:
  dcf_path: "@BUS_CONFIG_PATH@"

master:
  node_id: 1
  driver: "ros2_canopen::MasterDriver"
  package: "canopen_master_driver"
  namespace: "/master"
  sync_period: 10000
  heartbeat_producer: 50  # Master heartbeat period 10ms

defaults:
  dcf: "cia402_slave.eds"
  driver: "ros2_canopen::Cia402Driver"
  package: "canopen_402_driver"
  period: 10
  revision_number: 0
  boot_timeout_ms: 5000
  sdo:
    - {index: 0x6040, sub_index: 0, value: 0x86}
    - {index: 0x1006, sub_index: 0, value: 10000}
    - {index: 0x1016, sub_index: 1, value: 0x01012C}  # Heartbeat consumer: node 1, timeout 300ms
    - {index: 0x1017, sub_index: 0, value: 0xC8}  # Heartbeat producer period: 200ms
    - {index: 0x6081, sub_index: 0, value: 1000}
    - {index: 0x6083, sub_index: 0, value: 2000}

  tpdo: # TPDO needed statusword, actual velocity, actual position, mode of operation
    1:
      enabled: true
      cob_id: "auto"
      transmission: 0x01
      mapping:
        - {index: 0x6041, sub_index: 0} # status word
        - {index: 0x6061, sub_index: 0} # mode of operation display
    2:
      enabled: true
      cob_id: "auto"
      transmission: 0x01
      mapping:
        - {index: 0x6064, sub_index: 0} # position actual value
        - {index: 0x606c, sub_index: 0} # velocity actual position
    3:
      enabled: false
    4:
      enabled: false
  rpdo: # RPDO needed controlword, target position, target velocity, mode of operation
    1:
      enabled: true
      cob_id: "auto"
      mapping:
      - {index: 0x6040, sub_index: 0} # controlword
      - {index: 0x6060, sub_index: 0} # mode of operation
    2:
      enabled: true
      cob_id: "auto"
      mapping:
      - {index: 0x607A, sub_index: 0} # target position
      - {index: 0x60FF, sub_index: 0} # target velocity

nodes:
  cia402_device_1:
    node_id: 2
    scale_pos_to_dev: 4000000.0
    scale_pos_from_dev: 0.00000025
    scale_vel_to_dev: 4000000.0
    scale_vel_from_dev: 0.00000025
