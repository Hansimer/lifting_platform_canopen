# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    thread_priority: 90 # SCHED_FIFO priority for RT thread
    cpu_affinity: 2 # Pin RT thread to isolated core 2


    cia402_device_1_controller:
      type: canopen_ros2_controllers/Cia402DeviceController

    lifting_platform_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

cia402_device_1_controller:
  ros__parameters:
    joint: updown

lifting_platform_controller:
  ros__parameters:
    joints:
      - updown
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 5.0
      updown: { trajectory: 0.05, goal: 0.005 }
